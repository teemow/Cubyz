name: Build and push Docker image

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (overrides version derivation, e.g. 0.13.0)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  # Required for Trivy to upload SARIF results to the Security tab.
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cubyz-server

jobs:
  build:
    name: Build, push, and scan multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            version="${{ github.event.inputs.tag }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read Zig version
        run: echo "ZIG_VERSION=$(cat .zigversion)" >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Cross-compile both targets natively with Zig (no QEMU required for the
      # build itself). Both binaries are statically linked against musl so they
      # run on the Alpine runtime stage.
      - name: Build Cubyz for linux/amd64
        run: |
          zig build \
            --error-style minimal \
            -Dtarget=x86_64-linux-musl \
            -Doptimize=ReleaseFast \
            -Drelease=true \
            -Dcpu=baseline \
            -Dversion="${{ steps.version.outputs.version }}"
          mkdir -p binaries
          cp zig-out/bin/Cubyz binaries/Cubyz_linux_amd64
          rm -rf zig-out

      - name: Build Cubyz for linux/arm64
        run: |
          zig build \
            --error-style minimal \
            -Dtarget=aarch64-linux-musl \
            -Doptimize=ReleaseFast \
            -Drelease=true \
            -Dcpu=baseline \
            -Dversion="${{ steps.version.outputs.version }}"
          mkdir -p binaries
          cp zig-out/bin/Cubyz binaries/Cubyz_linux_arm64
          rm -rf zig-out

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=cubyz-server
            org.opencontainers.image.description=Headless Cubyz dedicated server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the freshly pushed image for known vulnerabilities. The first tag
      # produced by metadata-action is the most specific {{version}} tag, which
      # is what we want Trivy to inspect.
      - name: Pick primary image tag for scanning
        id: scan-target
        run: |
          primary_tag="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "image=${primary_tag}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-cubyz-server
