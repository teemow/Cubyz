name: Release Helm Chart

on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
      - '.github/workflows/helm-release.yml'
      - 'scripts/get-latest-version.sh'
  pull_request:
    branches:
      - master
    paths:
      - 'charts/**'
      - '.github/workflows/helm-release.yml'
      - 'scripts/get-latest-version.sh'
  # Republish the chart whenever a new container image has been released so
  # the packaged appVersion tracks the latest tag.
  workflow_run:
    workflows: ["Build and push Docker image"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_NAME: cubyz-server

jobs:
  release-chart:
    name: Package and publish chart
    runs-on: ubuntu-latest
    # Skip if triggered by workflow_run and the triggering workflow failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint chart
        run: helm lint charts/${{ env.CHART_NAME }}

      - name: Log in to GitHub Container Registry
        # Pull requests from forks cannot access GITHUB_TOKEN with packages:write,
        # so we only log in for events that are allowed to push.
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                --username ${{ github.actor }} \
                --password-stdin

      - name: Determine versions
        id: versions
        run: |
          CHART_VERSION=$(helm show chart charts/${{ env.CHART_NAME }} | awk '/^version:/ {print $2}')
          APP_VERSION=$(./scripts/get-latest-version.sh)

          # For non-master branches/PRs, suffix the chart and app versions so
          # we never collide with stable releases in the OCI registry.
          if [[ "${{ github.ref }}" != "refs/heads/master" ]]; then
            REF_SLUG=$(echo "${{ github.ref_name }}" | sed 's/[^A-Za-z0-9._-]/-/g')
            SHORT_SHA="${GITHUB_SHA::7}"
            CHART_VERSION="${CHART_VERSION}-${REF_SLUG}-${SHORT_SHA}"
            APP_VERSION="${APP_VERSION}-${REF_SLUG}-${SHORT_SHA}"
          fi

          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${CHART_VERSION}"
          echo "App version:   ${APP_VERSION}"

      - name: Package Helm chart
        run: |
          helm package charts/${{ env.CHART_NAME }} \
            --version "${{ steps.versions.outputs.chart_version }}" \
            --app-version "${{ steps.versions.outputs.app_version }}" \
            -d .helm-packages

      - name: Push Helm chart to OCI registry
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          helm push \
            ".helm-packages/${{ env.CHART_NAME }}-${{ steps.versions.outputs.chart_version }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "### Helm chart released"
            echo
            echo "**Chart:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }}:${{ steps.versions.outputs.chart_version }}\`"
            echo
            echo "**App version:** \`${{ steps.versions.outputs.app_version }}\`"
            echo
            echo "Install with:"
            echo
            echo '```bash'
            echo "helm install cubyz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }} --version ${{ steps.versions.outputs.chart_version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
