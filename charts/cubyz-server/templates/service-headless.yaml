apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubyz-server.fullname" . }}-headless
  labels:
    {{- include "cubyz-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: cubyz
      port: {{ .Values.containerPort }}
      targetPort: cubyz
      protocol: UDP
  selector:
    {{- include "cubyz-server.selectorLabels" . | nindent 4 }}
